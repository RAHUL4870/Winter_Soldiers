# Alembic migration configuration for NexaFreight Control Tower

[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration file timestamps
timezone = UTC

# Prepend sys.path to ensure nexafreight package is importable
prepend_sys_path = src .

# Version path pattern (where migration files live)
version_locations = migrations/versions

# Do NOT set sqlalchemy.url here — it is injected dynamically from
# nexafreight.config.Settings in migrations/env.py to maintain
# a single source of truth for database configuration

# Truncate long migration file slugs
truncate_slug_length = 40

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
