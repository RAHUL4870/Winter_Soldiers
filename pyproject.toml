[project]
name = "nexafreight"
version = "0.1.0"
description = "NexaFreight Control Tower — backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.36",
    "aiosqlite==0.20.0",
    "alembic==1.13.3",
    "duckdb==1.1.2",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "websockets==13.1",
    "apscheduler==3.10.4",
    "structlog==24.4.0",
    "lightgbm==4.5.0",
    "shap==0.46.0",
    "statsforecast==1.7.5",
    "searoute==1.4.3",
    "geopy==2.4.1",
    "shapely==2.0.6",
    "openrouteservice==2.3.3",
    "google-generativeai==0.8.3",
    "ollama==0.3.3",
    "optuna==4.0.0",
    "email-validator==2.2.0",
    "bcrypt==4.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "httpx==0.27.2",
    "pre-commit==3.8.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexafreight = ["py.typed"]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
