name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/ scripts/ migrations/
      - name: Type check
        run: mypy src/ scripts/ migrations/
      - name: Test
        env:
          JWT_SECRET: "ci-test-secret-at-least-32-characters-long-12345"
          ENVIRONMENT: "test"
        run: pytest tests/ -v
